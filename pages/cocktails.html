<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Übersicht aller Cocktails</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Cocktailpedia 🍹</a>
  </div>
</nav>

<!-- ✅ Main Content -->
<main class="container py-5">

  <h1 class="text-center fw-bold mb-5">Übersicht aller Cocktails</h1>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <!-- Cocktail 1 -->
    <div class="col">
      <div class="card h-100 shadow-sm border-0">
        <img src="images/mojito.jpg" class="card-img-top" alt="Mojito">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Mojito</h5>
          <p class="card-text">
            Erfrischender Cocktail mit Minze, Limette und Rum.
          </p>
          <a href="cocktails/mojito.html" class="btn btn-primary mt-auto">
            Details ansehen
          </a>
        </div>
      </div>
    </div>

    <!-- Cocktail 2 -->
    <div class="col">
      <div class="card h-100 shadow-sm border-0">
        <img src="images/margarita.jpg" class="card-img-top" alt="Margarita">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Margarita</h5>
          <p class="card-text">
            Klassischer Cocktail mit Tequila und Limettensaft.
          </p>
          <a href="cocktails/margarita.html" class="btn btn-primary mt-auto">
            Details ansehen
          </a>
        </div>
      </div>
    </div>

    <!-- Cocktail 3 -->
    <div class="col">
      <div class="card h-100 shadow-sm border-0">
        <img src="images/pina_colada.jpg" class="card-img-top" alt="Pina Colada">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Pina Colada</h5>
          <p class="card-text">
            Süßer Cocktail mit Ananas und Kokos.
          </p>
          <a href="cocktails/pina_colada.html" class="btn btn-primary mt-auto">
            Details ansehen
          </a>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- ✅ Footer -->
<footer class="bg-dark text-light text-center py-3 mt-5">
  <small>© 2026 Cocktailpedia</small>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
