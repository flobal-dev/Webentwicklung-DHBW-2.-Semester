<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Übersicht aller Cocktails</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-rbsA2VBKQWn5D2pGt5kDgX1pP6UhbAU6Y5GZCkxz97uh3CXc+OGpamoFVy38Qbsw"
    crossorigin="anonymous"
  >
</head>
<body>

  <!-- Inhalt hier -->
<div class="container py-5">
  <h1 class="text-center mb-4">Cocktailpedia 🍹</h1>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <!-- Cocktail 1 -->
    <div class="col">
      <div class="card h-100">
        <img src="images/mojito.jpg" class="card-img-top" alt="Mojito">
        <div class="card-body">
          <h5 class="card-title">Mojito</h5>
          <p class="card-text">Erfrischender Cocktail mit Minze, Limette und Rum.</p>
          <a href="cocktails/mojito.html" class="btn btn-primary">Details ansehen</a>
        </div>
      </div>
    </div>

    <!-- Cocktail 2 -->
    <div class="col">
      <div class="card h-100">
        <img src="images/margarita.jpg" class="card-img-top" alt="Margarita">
        <div class="card-body">
          <h5 class="card-title">Margarita</h5>
          <p class="card-text">Klassischer Cocktail mit Tequila und Limettensaft.</p>
          <a href="cocktails/margarita.html" class="btn btn-primary">Details ansehen</a>
        </div>
      </div>
    </div>

    <!-- Cocktail 3 -->
    <div class="col">
      <div class="card h-100">
        <img src="images/pina_colada.jpg" class="card-img-top" alt="Pina Colada">
        <div class="card-body">
          <h5 class="card-title">Pina Colada</h5>
          <p class="card-text">Süßer Cocktail mit Ananas und Kokos.</p>
          <a href="cocktails/pina_colada.html" class="btn btn-primary">Details ansehen</a>
        </div>
      </div>
    </div>

  </div>
</div>
  <!-- Bootstrap 5 JS Bundle (inkl. Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
