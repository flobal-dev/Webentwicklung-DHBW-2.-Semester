<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Übersicht aller Cocktails</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <!-- Eigene Styles -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

<!-- Navbar mit Links zu allen Seiten -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Cocktailpedia 🍹</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="cocktails.html">Cocktails</a></li>
        <li class="nav-item"><a class="nav-link" href="kategorien.html">Kategorien</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Über uns</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ✅ Main Content -->
<main class="container py-5">

  <h1 class="text-center fw-bold mb-5">Übersicht aller Cocktails</h1>

  <!-- Suchfeld: JS lauscht auf input-Events und filtert die Cards live -->
  <div class="mb-4">
    <input
      type="search"
      id="search-input"
      class="form-control form-control-lg"
      placeholder="Cocktail oder Zutat suchen… (z.B. Rum, Mojito)"
      autocomplete="off"
    >
  </div>

  <!-- Leerer Container — wird von app.js mit Karten aus cocktails.json befüllt -->
  <div id="cocktail-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <!-- Ladeindikator, der verschwindet sobald JS die Karten einfügt -->
    <div class="col-12 text-center py-5 text-muted" id="loading-indicator">
      Cocktails werden geladen…
    </div>

  </div>
</main>

<!-- ✅ Footer -->
<footer class="bg-dark text-light text-center py-3 mt-5">
  <small>© 2026 Cocktailpedia</small>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Unsere App-Logik: lädt Cocktails aus JSON und rendert die Cards -->
<script src="../js/app.js"></script>
</body>
</html>
