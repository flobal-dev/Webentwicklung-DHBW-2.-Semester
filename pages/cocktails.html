<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alle Cocktails – Cocktailpedia</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script>const t=localStorage.getItem("cp-theme");if(t)document.documentElement.setAttribute("data-bs-theme",t);</script>
</head>
<body>

<div class="blob-layer" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<!-- ── Navbar ─────────────────────────────────────────────── -->
<nav class="glass-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">🍹 Cocktailpedia</a>

    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="cocktails.html" class="active">Cocktails</a></li>
      <li><a href="kategorien.html">Kategorien</a></li>
      <li><a href="about.html">Über uns</a></li>
    </ul>

    <div class="nav-right">
      <button id="theme-toggle" class="theme-btn" title="Theme wechseln">☀️</button>
      <button class="nav-toggle" aria-label="Menü öffnen">☰</button>
    </div>
  </div>
</nav>

<main>

  <!-- ── Page hero ──────────────────────────────────────────── -->
  <div class="page-hero">
    <span class="section-label">Entdecke</span>
    <h1 class="section-title" style="font-size:clamp(2rem,5vw,3rem)">Alle Cocktails</h1>
    <p class="section-sub">Von klassischen Zeitlosern bis zu exotischen Geheimtipps — such, filter und entdecke.</p>
  </div>

  <!-- ── Search + filter ────────────────────────────────────── -->
  <div class="section" style="padding-top:0;padding-bottom:2rem">
    <div class="search-panel">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Cocktail oder Zutat suchen… (z.B. Rum, Mojito)"
          autocomplete="off"
        >
      </div>
      <div id="category-filters" class="filter-row"></div>
    </div>

    <!-- Card grid — filled by app.js -->
    <div id="cocktail-grid" class="card-grid">
      <div class="empty-state">
        <div class="empty-icon">🍹</div>
        <p class="empty-msg">Cocktails werden geladen…</p>
      </div>
    </div>
  </div>

</main>

<footer class="glass-footer">
  <p>© 2026 Cocktailpedia &nbsp;·&nbsp; DHBW Lörrach</p>
</footer>

<script src="../js/theme.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
