<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cocktailpedia</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script>const t=localStorage.getItem("cp-theme");if(t)document.documentElement.setAttribute("data-bs-theme",t);</script>
</head>
<body>

<div class="blob-layer" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<!-- ── Navbar ─────────────────────────────────────────────── -->
<nav class="glass-nav">

    <a href="index.html" class="brand">🍹 Cocktailpedia</a>

    <ul class="nav-links" id="nav-links">

  </div>
</nav>
