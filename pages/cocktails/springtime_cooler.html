  <h1>Springtime cooler 🥤</h1>

  <img src="images/springtime_cooler.jpg" class="card-img-top" alt="Springtime cooler">

  <h3>Zutaten:</h3>
  <ul>
    <li>1 cl Zuckersirup</li>
    <li>2 cl Blue Curacao</li>
    <li>3 cl Zitronensaft</li>
    <li>4 cl Wodka</li>
    <li>6 cl Orangensaft</li>
  </ul>

  <h3>Zubereitung:</h3>
  <p>Mische alle Zutaten in einem Shaker mit Eis und serviere in einem gekühlten Glas.</p>
