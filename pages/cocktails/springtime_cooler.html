<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Springtime Cooler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div class="container py-5">
  <h1>Springtime Cooler 🥤</h1>

  <img src="images/springtime_cooler.jpg" class="card-img-top" alt="Springtime Cooler">

  <h3>Zutaten:</h3>
  <ul>
    <li>1 cl Zuckersirup</li>
    <li>2 cl Blue Curacao</li>
    <li>3 cl Zitronensaft</li>
    <li>4 cl Wodka</li>
    <li>6 cl Orangensaft</li>
  </ul>

  <h3>Zubereitung:</h3>
  <p>Mische alle Zutaten in einem Shaker mit Eis und serviere in einem gekühlten Glas.</p>

  <a href="../cocktails.html" class="btn btn-secondary mt-3">Zurück</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
