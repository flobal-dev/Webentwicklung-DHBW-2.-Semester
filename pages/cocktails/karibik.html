<div class="container py-5">
  <h1>Mojito 🍃</h1>

  <img src="images/mojito.jpg" class="card-img-top" style="height: 200px; object-fit:cover;" alt="Mojito">

  <h3>Zutaten:</h3>
  <ul>
    <li>4 cl Wodka</li>
    <li>4 cl Maracujasaft</li>
    <li>4 cl Guavesaft</li>
    <li>1 cl Grenadine</li>
    <li>2 cl frisch gepresster Limettensaft</li>
  </ul>

  <h3>Zubereitung:</h3>
  <p>Mische alle Zutaten in einem Shaker mit Eis und serviere in einem gekühlten Glas.</p>

  <a href="../index.html" class="btn btn-secondary mt-3">Zurück</a>
</div>
